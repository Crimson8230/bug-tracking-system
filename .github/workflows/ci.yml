name: CI Build

on:
  push:
    branches: [main, dev]
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Build and test
        working-directory: backend
        run: ./mvnw clean verify

  notify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord PR
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content": "PushRequest wartet auf Review\n Autor: ${{ github.actor }}\n Branch: ${{ github.head_ref }}\n ${{ github.event.pull_request.html_url }}"
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}

  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord Failure
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content": "CI Build fehlgeschlagen\n Repo: ${{ github.repository }}\n User: ${{ github.actor }}\n Branch: ${{ github.ref_name }}"
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}
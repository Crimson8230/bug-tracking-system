name: CI Build

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Build
        working-directory: backend
        run: ./mvnw clean compile

      - name: Test
        working-directory: backend
        run: ./mvnw test